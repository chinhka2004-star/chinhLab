name: Publish Docker Image

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Prepare Labtainer Tars
        run: |
          # 1. Prepare sys.tar
          mkdir -p scenediff-detect/stego-container/sys_tar
          if [ -d "scenediff-detect/stego-container/_system" ] && [ "$(ls -A scenediff-detect/stego-container/_system)" ]; then
            tar -cf scenediff-detect/stego-container/sys_tar/sys.tar -C scenediff-detect/stego-container/_system .
          else
            touch empty_sys && tar -cf scenediff-detect/stego-container/sys_tar/sys.tar empty_sys && rm empty_sys
          fi
          
          # 2. Prepare sys_$lab.tar.gz
          touch scenediff-detect/sys_scenediff-detect.tar.gz
          
          # 3. Prepare home.tar
          mkdir -p scenediff-detect/stego-container/home_tar
          tar -cf scenediff-detect/stego-container/home_tar/home.tar \
            --exclude="sys_tar" --exclude="home_tar" --exclude="_system" --exclude="_bin" \
            -C scenediff-detect/stego-container/ .
            
          # 4. Prepare $lab.tar.gz
          touch scenediff-detect/scenediff-detect.tar.gz

      - name: Build and Push Docker Image
        run: |
          docker build \
            -f scenediff-detect/dockerfiles/Dockerfile.scenediff-detect.stego-container.student \
            --build-arg registry=labtainers \
            --build-arg lab=scenediff-detect \
            --build-arg labdir=scenediff-detect \
            --build-arg imagedir=stego-container \
            --build-arg user_name=ubuntu \
            --build-arg password=ubuntu \
            --build-arg version=1.0 \
            -t chinhka2004/scenediff-detect.stego-container.student .
          docker push chinhka2004/scenediff-detect.stego-container.student
